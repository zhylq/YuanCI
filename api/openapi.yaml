openapi: 3.1.0
info:
  title: YuanCI API
  version: 0.1.0
  description: >-
    Protected browser API contract. The NewAuthenticated handler is implemented
    and integration-tested; the executable can opt into authenticated preview
    with GitHub login, separate from insecure evaluation. There is no arbitrary
    session issuer. Mutation requests require an exact configured HTTPS Origin and a
    session-bound X-CSRF-Token. Evaluation compatibility is not production auth.
servers:
  - url: /api/v1
paths:
  /auth/status:
    get:
      operationId: getAuthenticationStatus
      security: []
      responses:
        '200':
          description: Public state, never credentials or account identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [evaluation, file, managed] }
                  initialized: { type: boolean }
                  configured: { type: boolean }
                  callback_url: { type: string }
        '503': { description: Status unavailable; never fall back to evaluation }
  /setup/exchange:
    post:
      operationId: redeemSetupCode
      security: []
      description: Managed mode only. Consume a 15-minute host-issued code and issue a 30-minute setup cookie, not a user session or admin grant.
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
      responses:
        '200':
          description: Sets Secure HttpOnly SameSite=Lax __Host-yuanci_setup cookie; CSRF token only in body
          content: { application/json: { schema: { type: object, properties: { csrf_token: { type: string } } } } }
        '401': { description: Invalid, expired, consumed or closed setup }
        '403': { description: Origin rejected }
        '503': { description: Store unavailable }
  /setup/settings:
    get:
      operationId: getSetupSettings
      security: [{ setupSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/LoginSettings' }
        '401': { description: Invalid or closed setup session }
    post:
      operationId: saveInitialLoginCandidate
      security: [{ setupSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/LoginCandidate' }
      responses:
        '201': { description: Candidate saved, not active; body contains candidate_id UUID }
        '401': { description: Invalid setup session }
        '403': { description: Origin/CSRF rejected }
        '409': { description: Active revision changed }
        '422': { description: Invalid fields }
  /setup/verify:
    post:
      operationId: verifyInitialLoginCandidate
      security: [{ setupSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/VerifyLoginCandidate' }
      responses:
        '200': { description: Sets flow cookie and returns authorization_url; activation requires designated identity and same setup session at callback }
        '401': { description: Invalid setup session }
        '403': { description: Origin/CSRF rejected }
        '409': { description: Candidate expired or superseded }
  /settings/auth:
    get:
      operationId: getManagedLoginSettings
      description: Managed mode; active instance administrator required.
      responses:
        '200': { $ref: '#/components/responses/LoginSettings' }
        '401': { description: Invalid session }
        '403': { description: Instance administrator required }
  /settings/auth/github:
    post:
      operationId: saveGitHubLoginCandidate
      description: Instance admin authenticated within ten minutes; preserves active login until verification. No disable/delete operation.
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/LoginCandidate' }
      responses:
        '201': { description: Candidate saved; body contains candidate_id UUID }
        '401': { description: Invalid or old session }
        '403': { description: Permission or Origin/CSRF denied }
        '409': { description: expected_active does not match active revision }
        '422': { description: Invalid fields or changed bootstrap subject }
  /settings/auth/github/verify:
    post:
      operationId: verifyGitHubLoginCandidate
      description: OAuth must verify an identity bound to the same admin; callback rechecks same session, live grants and candidate revision before activation.
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody: { $ref: '#/components/requestBodies/VerifyLoginCandidate' }
      responses:
        '200': { description: Sets flow cookie and returns authorization_url }
        '401': { description: Invalid or old session }
        '403': { description: Permission or CSRF denied }
        '409': { description: Expired or superseded candidate }
  /auth/github/start:
    get:
      operationId: startGitHubLogin
      security: []
      description: Top-level browser navigation. Creates a five-minute browser-bound flow with S256 PKCE. HEAD is rejected.
      responses:
        '303':
          description: Redirect to GitHub; sets Secure HttpOnly SameSite=Lax __Host-yuanci_oauth cookie
          headers:
            Location: { schema: { type: string, format: uri }, description: Fixed GitHub authorization endpoint }
        '429': { description: Pending login flow capacity reached; retry later }
        '503': { description: Login flow store unavailable }
  /auth/github/callback:
    get:
      operationId: finishGitHubLogin
      security: []
      description: >-
        Requires the browser-bound flow cookie and state. Each state is consumed once
        before code exchange. Exactly one code or provider error is expected.
        Linking also requires the same recent browser session used to initiate it.
        All responses are no-store and no-referrer; HEAD is rejected.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }
        - { name: code, in: query, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: error, in: query, schema: { type: string } }
        - { name: __Host-yuanci_oauth, in: cookie, required: true, schema: { type: string } }
      responses:
        '303': { description: Identity and session committed; sets session cookie, expires flow cookie and redirects to / }
        '400': { description: Invalid, ambiguous, denied, expired or already consumed flow; restart login }
        '401': { description: Suspended user or invalid linking session }
        '403': { description: Account is not the explicitly configured bootstrap administrator }
        '409': { description: External identity belongs to another account }
        '502': { description: Could not verify GitHub identity; restart login }
        '503': { description: Login transaction unavailable }
  /auth/github/link:
    post:
      operationId: linkGitHubIdentity
      description: Begin explicit binding to the current account; requires a session created within ten minutes. Navigate to the returned URL in the same browser.
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200':
          description: Browser-bound flow created, HttpOnly flow cookie set
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: { type: string, format: uri }
        '401': { description: Invalid or insufficiently recent session }
        '403': { description: Origin or CSRF validation failed }
        '429': { description: Pending flow capacity reached }
        '503': { description: Login store unavailable }
  /session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Active user and session-bound CSRF token; Cache-Control no-store; no session credential
          content:
            application/json:
              schema:
                type: object
                required: [user_id, display_name, expires_at, csrf_token]
                properties:
                  user_id: { type: string, format: uuid }
                  display_name: { type: string }
                  expires_at: { type: string, format: date-time }
                  csrf_token: { type: string }
        '401': { description: Missing, invalid, revoked or expired session }
        '503': { description: Session store unavailable }
    delete:
      operationId: logout
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Session revoked with audit event and cookie expired }
        '401': { description: Invalid session }
        '403': { description: Origin or CSRF validation failed }
        '503': { description: Session could not be revoked }
  /system/info:
    get:
      operationId: getSystemInfo
      responses:
        '200':
          description: Server build and capability information
          content: { application/json: { schema: { type: object } } }
  /pipelines/validate:
    post:
      operationId: validatePipeline
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties: { content: { type: string, maxLength: 1048576 } }
      responses:
        '200': { description: Valid compiled pipeline }
        '422': { description: Pipeline validation errors }
  /runs:
    get:
      operationId: listRuns
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Runs in the authorized project only; unowned evaluation runs are excluded
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '400': { description: Missing or invalid project ID }
        '401': { description: Invalid session }
        '403': { description: Project unavailable or permission denied }
    post:
      operationId: createRun
      parameters:
        - { $ref: '#/components/parameters/BrowserOrigin' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pipeline, project_id]
              properties:
                project_id: { type: string, format: uuid }
                pipeline: { type: string }
                event: { type: string, enum: [manual], default: manual }
                ref: { type: string }
                commit_sha: { type: string }
      responses:
        '201': { description: Run accepted and transactionally queued }
        '401': { description: Invalid session }
        '403': { description: Origin, CSRF or scoped permission denied }
        '422': { description: Pipeline validation errors }
components:
  requestBodies:
    LoginCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [client_id, client_secret, bootstrap_subject]
            properties:
              client_id: { type: string }
              client_secret: { type: string, minLength: 16, maxLength: 4096, writeOnly: true }
              bootstrap_subject: { type: string, pattern: '^[1-9][0-9]*$' }
              expected_active: { type: [string, 'null'], format: uuid }
    VerifyLoginCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [candidate_id]
            properties:
              candidate_id: { type: string, format: uuid }
  responses:
    LoginSettings:
      description: Active and current actor's candidate metadata only; no plaintext or encrypted secret bytes
      content:
        application/json:
          schema:
            type: object
            properties:
              active: { oneOf: [{ $ref: '#/components/schemas/LoginConfig' }, { type: 'null' }] }
              candidate: { oneOf: [{ $ref: '#/components/schemas/LoginConfig' }, { type: 'null' }] }
              csrf_token: { type: string }
              callback_url: { type: string }
  parameters:
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      schema: { type: string }
      description: Exact configured HTTPS public origin; forwarded Host headers are not authority
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Session-bound value returned by GET /session
  schemas:
    LoginConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string }
        bootstrap_subject: { type: string }
        status: { type: string, enum: [candidate, active, retired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Run:
      type: object
      required: [id, pipeline_name, event, status, config_sha256, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        pipeline_name: { type: string }
        event: { type: string }
        ref: { type: string }
        commit_sha: { type: string }
        status:
          type: string
          enum: [queued, running, waiting_approval, succeeded, failed, canceled]
        config_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        plan: { type: object }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
  securitySchemes:
    setupSession: { type: apiKey, in: cookie, name: __Host-yuanci_setup }
    cookieSession: { type: apiKey, in: cookie, name: __Host-yuanci_session }
security:
  - cookieSession: []
