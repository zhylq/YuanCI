services:
  server:
    image: yuanci-quickstart-server:command-6322c0f
  runner:
    image: yuanci-quickstart-runner:command-354ae6c
  deployment-state-init:
    image: yuanci-quickstart-runner:command-354ae6c
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /state /bootstrap && chown 10001:10001 /state /bootstrap"]
    volumes: ["deployment-state:/state", "deployment-bootstrap:/bootstrap"]
    network_mode: none
    security_opt: ["no-new-privileges:true"]
  deployment-token-init:
    image: yuanci-quickstart-server:command-6322c0f
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      YUANCI_DATABASE_URL: postgres://yuanci:${YUANCI_POSTGRES_PASSWORD:?set existing database password}@postgres:5432/yuanci_gitee?sslmode=disable
    command:
      - |
        if [ ! -f /state/identity/identity.json ]; then
          rm -f /bootstrap/registration-token
          yuancictl runner-token issue -pool deployment -file /bootstrap/registration-token -ttl 30m
          chown 10001:10001 /bootstrap/registration-token
        fi
    volumes: ["deployment-state:/state:ro", "deployment-bootstrap:/bootstrap"]
    depends_on:
      server: { condition: service_healthy }
      deployment-state-init: { condition: service_completed_successfully }
    security_opt: ["no-new-privileges:true"]
  deployment-runner:
    image: yuanci-quickstart-runner:command-354ae6c
    restart: unless-stopped
    environment:
      YUANCI_RUNNER_GRPC_ADDRESS: gitee-server:9443
      YUANCI_RUNNER_GRPC_SERVER_NAME: gitee-server
      YUANCI_RUNNER_ROOT_CA_FILE: /run/yuanci-pki/identity/server/root-cert.pem
      YUANCI_RUNNER_STATE_DIR: /var/lib/yuanci-runner/identity
      YUANCI_RUNNER_REGISTRATION_TOKEN_FILE: /run/yuanci-bootstrap/registration-token
      YUANCI_RUNNER_NAME: yuanplan-deployment
      YUANCI_RUNNER_CAPACITY: "1"
      YUANCI_RUNNER_ISOLATION_LEVEL: deployment
      YUANCI_RUNNER_DEPLOYMENT_POLICY_FILE: /etc/yuanci/deployment-policy.json
      YUANCI_RUNNER_AVAILABLE_DISK_BYTES: ${YUANCI_RUNNER_AVAILABLE_DISK_BYTES:-10737418240}
    user: "10001:10001"
    group_add: ["${YUANCI_DOCKER_GID:?set existing Docker socket group}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/yuanplan:/opt/yuanplan:ro
      - /etc/yuanci/deployment-policy.json:/etc/yuanci/deployment-policy.json:ro
      - runner-pki:/run/yuanci-pki:ro
      - deployment-state:/var/lib/yuanci-runner
      - deployment-bootstrap:/run/yuanci-bootstrap
    depends_on:
      deployment-token-init: { condition: service_completed_successfully }
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
volumes:
  deployment-state:
  deployment-bootstrap:
