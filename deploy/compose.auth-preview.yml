# Independent login-only preview. Never combine with the Quickstart Compose file.
name: yuanci-auth-preview

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yuanci_auth_preview
      POSTGRES_USER: yuanci
      POSTGRES_PASSWORD: ${YUANCI_POSTGRES_PASSWORD:?set an independent preview database password}
    volumes:
      - auth-preview-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanci -d yuanci_auth_preview"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  server:
    build:
      context: ..
      target: server
    restart: unless-stopped
    environment:
      YUANCI_DATABASE_URL: postgres://yuanci:${YUANCI_POSTGRES_PASSWORD}@postgres:5432/yuanci_auth_preview?sslmode=disable
      YUANCI_AUTHENTICATED_PREVIEW: "true"
      YUANCI_DEV_IN_MEMORY: "false"
      YUANCI_MILESTONE0_INSECURE_API: "false"
      YUANCI_PUBLIC_ORIGIN: ${YUANCI_PUBLIC_ORIGIN:?set the HTTPS origin}
      YUANCI_GITHUB_CLIENT_ID: ${YUANCI_GITHUB_CLIENT_ID:?set the GitHub App client ID}
      YUANCI_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      YUANCI_BOOTSTRAP_GITHUB_USER_ID: ${YUANCI_BOOTSTRAP_GITHUB_USER_ID:?set the administrator numeric GitHub user ID}
    secrets: [github_client_secret]
    ports: ["127.0.0.1:${YUANCI_AUTH_PREVIEW_PORT:-8081}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]

secrets:
  github_client_secret:
    file: ${YUANCI_GITHUB_CLIENT_SECRET_PATH:?set the absolute client secret file path}

volumes:
  auth-preview-postgres:
